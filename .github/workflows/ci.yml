name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Run metric helper checks
        run: npm run test:metric-helpers
        working-directory: client

      - name: Run unit tests
        run: npm run test
        working-directory: client

      - name: Run linter
        run: npm run lint
        working-directory: client

      - name: Build production bundle
        run: npm run build
        working-directory: client

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: server

      - name: Run unit tests
        env:
          APP_NAME: Darukaa.Earth API
          APP_VERSION: 1.0.0
          DEBUG: 'true'
          DATABASE_URL: postgresql+psycopg://darukaa_test:darukaa_test@localhost:5432/darukaa_test
          FRONTEND_URL: http://localhost:5173
          JWT_SECRET_KEY: ci-only-placeholder-secret-key-minimum-32-chars
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: '30'
        run: python -m unittest discover -s tests -v
        working-directory: server

      - name: Compile check
        env:
          APP_NAME: Darukaa.Earth API
          APP_VERSION: 1.0.0
          DEBUG: 'true'
          DATABASE_URL: postgresql+psycopg://darukaa_test:darukaa_test@localhost:5432/darukaa_test
          FRONTEND_URL: http://localhost:5173
          JWT_SECRET_KEY: ci-only-placeholder-secret-key-minimum-32-chars
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: '30'
        run: python -m compileall -q app tests
        working-directory: server